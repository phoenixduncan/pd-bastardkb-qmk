name: Build Charybdis firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-avr avr-libc binutils-avr
          python -m pip install qmk
          python -m pip install -r requirements.txt

      - name: Build
        run: make bastardkb/charybdis/4x6/v2/elitec:vial

      - uses: actions/upload-artifact@v4
        with:
          name: charybdis-firmware
          path: "*.hex"
