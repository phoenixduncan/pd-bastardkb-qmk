name: Build Charybdis firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Mark repo safe
        run: git config --global --add safe.directory '*'

      - name: Set up Python 3.11
        run: |
          python3 -m pip install --break-system-packages uv || true
          uv venv --python 3.11 /tmp/py311
          uv pip install --python /tmp/py311/bin/python qmk -r requirements.txt

      - name: Build
        run: |
          export PATH=/tmp/py311/bin:$PATH
          make bastardkb/charybdis/4x6/v2/elitec:vial

      - uses: actions/upload-artifact@v4
        with:
          name: charybdis-firmware
          path: "*.hex"
